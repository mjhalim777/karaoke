<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Karaoke User Flow</title>
<style>
  @page { size: A4 landscape; margin: 12mm; }
  body { margin: 0; padding: 28px; font: 15px/1.45 "Segoe UI", Roboto, Arial, sans-serif; color: #1d1b2e; background: #fff; }
  h1 { margin: 0 0 2px; font-size: 26px; }
  .sub { margin: 0 0 18px; color: #5b5675; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<h1>Karaoke: User Flow Diagram</h1>
<p class="sub">How a guest picks a song and how it plays on the TV · https://mjhalim777.github.io/karaoke/</p>

<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a4566"/>
    </marker>
    <style>
      .box { fill: #fff; stroke-width: 2; }
      .p { stroke: #7b5cff; } .t { stroke: #e53935; } .d { stroke: #f9a825; }
      .h { font-size: 15px; font-weight: 700; } .s { font-size: 12.5px; fill: #5b5675; }
      .ln { stroke: #4a4566; stroke-width: 2; fill: none; marker-end: url(#a); }
      .lane { font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <!-- lanes -->
  <rect x="10" y="10" width="1180" height="180" rx="14" fill="#f6f3ff"/>
  <text x="26" y="36" class="lane" fill="#4a3f8f">📺 TV (host)</text>
  <rect x="10" y="205" width="1180" height="385" rx="14" fill="#fbf9ff"/>
  <text x="26" y="231" class="lane" fill="#4a3f8f">📱 Guest's phone</text>

  <!-- TV row -->
  <rect x="30" y="55" width="200" height="110" rx="12" class="box t"/>
  <text x="130" y="85" text-anchor="middle" class="h">1. Open TV page</text>
  <text x="130" y="107" text-anchor="middle" class="s">/karaoke/tv</text>
  <text x="130" y="127" text-anchor="middle" class="s">creates a 4-letter room</text>
  <text x="130" y="147" text-anchor="middle" class="s">shows room code + QR</text>

  <rect x="660" y="55" width="230" height="110" rx="12" class="box t"/>
  <text x="775" y="85" text-anchor="middle" class="h">6. Song plays</text>
  <text x="775" y="107" text-anchor="middle" class="s">official YouTube embedded</text>
  <text x="775" y="127" text-anchor="middle" class="s">player, by video ID</text>
  <text x="775" y="147" text-anchor="middle" class="s">progress bar, no extra API calls</text>

  <rect x="940" y="55" width="230" height="110" rx="12" class="box t"/>
  <text x="1055" y="85" text-anchor="middle" class="h">7. Song ends</text>
  <text x="1055" y="107" text-anchor="middle" class="s">fun score pop-up (optional)</text>
  <text x="1055" y="127" text-anchor="middle" class="s">song removed from queue</text>
  <text x="1055" y="147" text-anchor="middle" class="s">next song starts</text>

  <!-- phone row -->
  <rect x="30" y="260" width="200" height="110" rx="12" class="box p"/>
  <text x="130" y="290" text-anchor="middle" class="h">2. Join room</text>
  <text x="130" y="312" text-anchor="middle" class="s">scan QR or type code</text>
  <text x="130" y="332" text-anchor="middle" class="s">/karaoke/remote?room=CODE</text>
  <text x="130" y="352" text-anchor="middle" class="s">optional nickname</text>

  <rect x="270" y="260" width="220" height="110" rx="12" class="box p"/>
  <text x="380" y="290" text-anchor="middle" class="h">3. Search a song</text>
  <text x="380" y="312" text-anchor="middle" class="s">types e.g. "my way"</text>
  <text x="380" y="332" text-anchor="middle" class="s">site adds "karaoke"</text>
  <text x="380" y="352" text-anchor="middle" class="s">or taps 🎲 random song</text>

  <rect x="270" y="440" width="220" height="120" rx="12" class="box" stroke="#e53935" stroke-dasharray="6 4"/>
  <text x="380" y="470" text-anchor="middle" class="h">YouTube Data API</text>
  <text x="380" y="492" text-anchor="middle" class="s">search.list (1 call)</text>
  <text x="380" y="512" text-anchor="middle" class="s">embeddable videos only</text>
  <text x="380" y="532" text-anchor="middle" class="s">returns up to 15 results</text>

  <rect x="530" y="260" width="220" height="110" rx="12" class="box p"/>
  <text x="640" y="290" text-anchor="middle" class="h">4. Pick a result</text>
  <text x="640" y="312" text-anchor="middle" class="s">thumbnail, title, channel</text>
  <text x="640" y="332" text-anchor="middle" class="s">taps "Add"</text>

  <rect x="790" y="260" width="220" height="110" rx="12" class="box d"/>
  <text x="900" y="290" text-anchor="middle" class="h">5. Added to queue</text>
  <text x="900" y="312" text-anchor="middle" class="s">Firebase room queue</text>
  <text x="900" y="332" text-anchor="middle" class="s">video ID, title, nickname</text>
  <text x="900" y="352" text-anchor="middle" class="s">all phones + TV update live</text>

  <rect x="790" y="440" width="380" height="120" rx="12" class="box p"/>
  <text x="980" y="470" text-anchor="middle" class="h">Any time: manage the night</text>
  <text x="980" y="492" text-anchor="middle" class="s">reorder or remove queued songs</text>
  <text x="980" y="512" text-anchor="middle" class="s">pause / play / skip the current song</text>
  <text x="980" y="532" text-anchor="middle" class="s">turn score and sounds on/off</text>

  <!-- flow -->
  <path d="M130 165 L130 255" class="ln"/>
  <text x="140" y="215" class="s">QR / code</text>
  <path d="M230 315 L265 315" class="ln"/>
  <path d="M380 370 L380 435" class="ln"/>
  <path d="M420 440 L560 375" class="ln"/>
  <text x="500" y="420" class="s">results</text>
  <path d="M750 315 L785 315" class="ln"/>
  <path d="M900 260 L790 170" class="ln"/>
  <text x="860" y="208" class="s">TV picks next</text>
  <path d="M890 110 L935 110" class="ln"/>
  <path d="M1055 165 C1100 230 1100 230 1012 300" class="ln"/>
  <text x="1080" y="225" class="s">next in queue</text>
  <path d="M980 440 L960 375" class="ln"/>
</svg>
</body>
</html>
