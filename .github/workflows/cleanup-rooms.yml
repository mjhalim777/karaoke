# Deletes karaoke rooms that haven't been used for 7 days, so stored song titles and
# singer names never stay longer than 30 days (promised in privacy.html).
# Runs every day; can also be started by hand from the Actions tab ("Run workflow").
name: Clean up old rooms

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 4:00 AM Philippine time
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete rooms inactive for 7+ days
        env:
          DB: https://karaoke-24c7c-default-rtdb.asia-southeast1.firebasedatabase.app
          MAX_DAYS: "7"
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          db, max_ms = os.environ["DB"], int(os.environ["MAX_DAYS"]) * 86400 * 1000
          def call(method, path):
              req = urllib.request.Request(f"{db}/{path}.json", method=method)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read() or b"null")
          rooms = call("GET", "stats/activeRooms") or {}
          now = time.time() * 1000
          old = [c for c, t in rooms.items() if not isinstance(t, (int, float)) or now - t > max_ms]
          for code in old:
              call("DELETE", f"rooms/{code}")
              call("DELETE", f"stats/activeRooms/{code}")
          # keep the daily search counts for 60 days only (they hold no personal data)
          days = call("GET", "stats/searches") or {}
          cutoff = time.strftime("%Y-%m-%d", time.gmtime(time.time() - 60 * 86400))
          for d in [d for d in days if d < cutoff]:
              call("DELETE", f"stats/searches/{d}")
          print(f"active rooms: {len(rooms)}, deleted: {len(old)} {old}")
          PY
